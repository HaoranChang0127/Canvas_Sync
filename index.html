<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Canvas Sync</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#1e293b;font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:1000px;margin:auto;padding:32px 24px 60px}.toolbar{position:sticky;top:0;z-index:2;background:#f5f7fa;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:8px 0 24px}.brand p{margin:5px 0 0;color:#66758a;font-size:14px}h1{font-size:27px;letter-spacing:-.03em;margin:0}h2{font-size:16px;margin:0 0 14px}.panel{background:white;border:1px solid #e4e9ef;border-radius:14px;padding:24px;margin-bottom:18px;box-shadow:0 2px 12px #243a5310}button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;white-space:nowrap;background:#1e3a5f;color:#fff}button:disabled{opacity:.45;cursor:default}.sub{background:#fff;color:#344860;border:1px solid #d0d9e4}.field{margin-top:18px}.field:first-of-type{margin-top:0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:8px;color:#465970}.field-row{display:flex;gap:10px;align-items:center}.field input{min-width:0;flex:1;border:1px solid #cbd6e2;border-radius:8px;padding:10px 12px;font:inherit;color:#18212d}.field input:focus{outline:2px solid #a8c5e8;outline-offset:1px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.course-heading{display:flex;justify-content:space-between;align-items:baseline;gap:16px}.course-heading p,.hint{margin:0;color:#78879a;font-size:13px}.courses{margin-top:12px}.courses h2{font-size:13px;color:#6f7e91;text-transform:uppercase;letter-spacing:.04em;margin:24px 0 4px}.course{border-top:1px solid #eef1f5;padding:16px 0}.course label{display:flex;gap:12px;align-items:center}.course label span{flex:1;min-width:0;overflow-wrap:anywhere}.course small,.course .state{color:#697585}.course progress{display:block;width:100%;height:11px;margin:10px 0 2px}.course .state{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.course .state[data-state=error]{color:#9a4a00}.course .state[data-state=partial]{color:#929ca8}#status{color:#66758a;min-height:20px;margin:18px 0 0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:600px){.wrap{padding:20px 16px 40px}.toolbar{padding:8px 0 16px}.brand p{display:none}.panel{padding:18px}.field-row{flex-wrap:wrap}.field-row input{flex-basis:100%}.field-row button{flex:1}.course-heading{display:block}.course-heading p{margin-top:5px}h1{font-size:23px}}
</style></head><body><main class="wrap">
<header class="toolbar"><div class="brand"><h1>Canvas Sync</h1><p>Your course materials, ready when you need them.</p></div><button id="sync">Sync selected courses</button></header>
<section class="panel"><h2>Connection &amp; storage</h2>
<div class="field"><label for="canvas-url">Canvas address</label><div class="field-row"><input id="canvas-url" type="url" placeholder="https://canvas.your-school.edu"><button id="save-canvas" class="sub">Save address</button></div></div>
<div class="field"><label for="folder">Sync folder</label><div class="field-row"><input id="folder" type="text" placeholder="Select or enter an existing folder"><button id="choose" class="sub">Choose folder</button><button id="save-folder" class="sub">Save folder</button></div></div>
<div class="actions"><button id="login" class="sub">Sign in to Canvas</button><button id="load" class="sub">Refresh courses</button></div></section>
<section class="panel"><div class="course-heading"><h2>Courses</h2><p>Select courses to save a local copy.</p></div><div class="courses" id="courses">Sign in and refresh courses to get started.</div><p id="status">Ready</p></section>
</main>
<script>
const $=id=>document.getElementById(id);let busy=false,tracking=false,currentFolder='',currentCanvasUrl='';
async function call(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Operation failed');return j}
function setFolder(folder){currentFolder=folder;$('folder').value=folder;}
function historyText(history){if(!history)return 'Never synced';const stamp=typeof history==='string'?history:history.at;const prefix=typeof history==='object'&&history.state==='partial'?'Last sync: partially complete · ':'Last sync: ';return prefix+new Date(stamp).toLocaleString();}
async function changeFolder(folder){setFolder(folder);const data=await call('/api/history');for(const row of document.querySelectorAll('.course')){row.querySelector('.last').textContent=historyText(data.history[row.dataset.id]);row.querySelector('progress').hidden=true;row.querySelector('.state').textContent='';}}
async function loadSettings(){try{const settings=await call('/api/settings');setFolder(settings.folder);currentCanvasUrl=settings.canvasUrl;$('canvas-url').value=currentCanvasUrl}catch(e){$('status').textContent=e.message}}
function addressSaved(){if($('canvas-url').value.trim()!==currentCanvasUrl){$('status').textContent='Save the Canvas address first.';return false}return true}
$('save-canvas').onclick=async()=>{try{const old=currentCanvasUrl;const data=await call('/api/canvas-url',{canvasUrl:$('canvas-url').value});currentCanvasUrl=data.canvasUrl;$('canvas-url').value=currentCanvasUrl;if(old!==currentCanvasUrl){$('courses').replaceChildren();tracking=false;busy=false;}$('status').textContent=old!==currentCanvasUrl?'Canvas address saved. Sign in and refresh courses.':'Canvas address saved.'}catch(e){$('status').textContent=e.message}};
$('login').onclick=async()=>{if(!addressSaved())return;try{await call('/api/login',{});$('status').textContent='Complete sign-in in the browser window, then refresh courses.'}catch(e){$('status').textContent=e.message}};
$('choose').onclick=async()=>{try{const data=await call('/api/choose-folder',{});if(!data.cancelled){await changeFolder(data.folder);$('status').textContent='Sync folder saved.'}}catch(e){$('status').textContent=e.message}};
$('save-folder').onclick=async()=>{try{const data=await call('/api/settings',{folder:$('folder').value});await changeFolder(data.folder);$('status').textContent='Sync folder saved.'}catch(e){$('status').textContent=e.message}};
function courseRow(c){const box=document.createElement('div');box.className='course';box.dataset.id=c.id;const label=document.createElement('label'),check=document.createElement('input'),name=document.createElement('span'),last=document.createElement('small'),bar=document.createElement('progress'),state=document.createElement('div');check.type='checkbox';check.value=c.id;name.textContent=c.name;last.className='last';last.textContent=historyText(c.history);bar.max=100;bar.value=0;bar.hidden=true;state.className='state';label.append(check,name,last);box.append(label,bar,state);return box;}
$('load').onclick=async()=>{if(!addressSaved())return;try{$('status').textContent='Loading courses…';const data=await call('/api/courses');if($('folder').value===currentFolder)setFolder(data.folder);$('courses').replaceChildren();for(const [title,isDashboard] of [['Dashboard courses',true],['Other courses',false]]){const list=data.courses.filter(c=>Boolean(c.dashboard)===isDashboard);if(!list.length)continue;const h=document.createElement('h2');h.textContent=title;$('courses').append(h);for(const c of list)$('courses').append(courseRow(c));}$('status').textContent=data.warnings?.length?data.warnings.join('\n'):(data.courses.length?'Select the courses you want to sync.':'No accessible courses found.')}catch(e){$('status').textContent=e.message}};
$('sync').onclick=async()=>{if(!addressSaved())return;const ids=[...document.querySelectorAll('.course input:checked')].map(x=>Number(x.value));if(!ids.length){$('status').textContent='Select at least one course.';return}if($('folder').value!==currentFolder){$('status').textContent='The sync folder has changed. Click Save folder first.';return}try{tracking=true;await call('/api/sync',{ids});$('status').textContent='Starting sync…'}catch(e){tracking=false;$('status').textContent=e.message}};
async function refresh(){try{const s=await call('/api/status');if(s.busy||busy||tracking){$('status').textContent=s.message;for(const [id,data] of Object.entries(s.courses)){const row=document.querySelector(`.course[data-id="${id}"]`);if(!row)continue;const bar=row.querySelector('progress'),text=row.querySelector('.state'),last=row.querySelector('.last');bar.hidden=data.state!=='running'&&data.state!=='pending';bar.value=data.percent;text.dataset.state=data.state;text.textContent=data.state==='running'?`Syncing: ${data.message}`:data.message;if(data.state==='partial'&&data.failures?.length)text.textContent+='\n'+data.failures.slice(0,5).map(x=>'• '+x).join('\n')+(data.failures.length>5?'\nSee the course index for more details.':'');if(data.state==='running')last.textContent='Syncing';else if(data.state==='pending')last.textContent='Waiting';else if(data.state==='error')last.textContent='Sync failed';else if(data.last)last.textContent=historyText({at:data.last,state:data.state});}}for(const id of ['sync','load','login','choose','save-folder','folder','canvas-url','save-canvas'])$(id).disabled=s.busy;if(tracking&&!s.busy&&Object.keys(s.courses).length)tracking=false;busy=s.busy}catch{}setTimeout(refresh,1000)}
loadSettings();refresh();
</script></body></html>
