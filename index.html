<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Canvas 课程资料库</title><style>
body{font:15px system-ui,'Microsoft YaHei',sans-serif;background:#f4f6f8;color:#18212d;margin:0}.wrap{max-width:720px;margin:52px auto;padding:0 20px}h1{font-size:25px;margin-bottom:5px}p{color:#566373}.panel{background:white;border:1px solid #dfe5eb;border-radius:12px;padding:22px;box-shadow:0 6px 28px #1e293b09}button{background:#202f42;color:white;border:0;border-radius:7px;padding:10px 17px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.sub{background:white;color:#253447;border:1px solid #cdd5df}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.courses{margin:20px 0;border-top:1px solid #eee}.course{border-bottom:1px solid #eee;padding:12px 2px}.course label{display:flex;gap:10px;align-items:center}.course label span{flex:1}.course small,.course .state{color:#697585}.course progress{display:block;width:100%;height:11px;margin:10px 0 2px}.course .state{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.course .state[data-state=error],.course .state[data-state=partial]{color:#9a4a00}#status{min-height:22px;white-space:pre-wrap}#hint{font-size:13px}.path{font-size:13px;color:#697585;overflow-wrap:anywhere}
</style></head><body><main class="wrap"><h1>Canvas 课程资料库</h1><p id="hint">登录 Canvas → 选择课程 → 点击同步，资料将保存到本地文件夹。</p><div class="panel"><div class="actions"><button id="login" class="sub">登录 Canvas</button><button id="load" class="sub">刷新课程</button></div><p class="path" id="folder"></p><div class="courses" id="courses">请先登录并刷新课程。</div><div class="actions"><button id="sync">同步所选课程</button></div><p id="status">等待操作</p></div></main><script>
const $=id=>document.getElementById(id);let busy=false,tracking=false;
async function call(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'操作失败');return j}
$('login').onclick=async()=>{try{await call('/api/login',{});$('status').textContent='请在打开的浏览器中完成登录，然后刷新课程。'}catch(e){$('status').textContent=e.message}};
$('load').onclick=async()=>{try{$('status').textContent='正在读取课程…';const data=await call('/api/courses');$('folder').textContent='资料保存位置：'+data.folder;$('courses').replaceChildren();for(const c of data.courses){const box=document.createElement('div');box.className='course';box.dataset.id=c.id;const label=document.createElement('label'),check=document.createElement('input'),name=document.createElement('span'),last=document.createElement('small'),bar=document.createElement('progress'),state=document.createElement('div');check.type='checkbox';check.value=c.id;name.textContent=c.name;last.className='last';last.textContent=c.last?'上次同步：'+new Date(c.last).toLocaleString():'尚未同步';bar.max=100;bar.value=0;bar.hidden=true;state.className='state';label.append(check,name,last);box.append(label,bar,state);$('courses').append(box)}$('status').textContent=data.courses.length?'请选择要同步的课程。':'没有找到可访问课程。'}catch(e){$('status').textContent=e.message}};
$('sync').onclick=async()=>{const ids=[...document.querySelectorAll('.course input:checked')].map(x=>Number(x.value));if(!ids.length){$('status').textContent='请至少选择一门课程。';return}try{tracking=true;await call('/api/sync',{ids});$('status').textContent='开始同步…'}catch(e){tracking=false;$('status').textContent=e.message}};
async function refresh(){try{const s=await call('/api/status');if(s.busy||busy||tracking){$('status').textContent=s.message;for(const [id,data] of Object.entries(s.courses)){const row=document.querySelector(`.course[data-id="${id}"]`);if(!row)continue;const bar=row.querySelector('progress'),text=row.querySelector('.state');bar.hidden=false;bar.value=data.percent;text.dataset.state=data.state;text.textContent=data.message;if(data.last)row.querySelector('.last').textContent='上次同步：'+new Date(data.last).toLocaleString();}}$('sync').disabled=s.busy;$('load').disabled=s.busy;$('login').disabled=s.busy;if(tracking&&!s.busy&&Object.keys(s.courses).length)tracking=false;busy=s.busy}catch{}setTimeout(refresh,1000)}refresh();
</script></body></html>
