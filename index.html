<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Canvas 课程资料库</title>
<style>
*{box-sizing:border-box}body{font:15px system-ui,'Microsoft YaHei',sans-serif;background:#f4f6f8;color:#18212d;margin:0}.wrap{max-width:800px;margin:auto;padding:0 20px 40px}.toolbar{position:sticky;top:0;z-index:2;background:#f4f6f8;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 14px}h1{font-size:24px;margin:0}h2{font-size:16px;margin:22px 0 4px}p{color:#566373}.hint{font-size:13px;margin:2px 0 16px}.panel{background:white;border:1px solid #dfe5eb;border-radius:12px;padding:20px;box-shadow:0 6px 28px #1e293b09}button{background:#202f42;color:white;border:0;border-radius:7px;padding:10px 16px;cursor:pointer;white-space:nowrap}button:disabled{opacity:.45;cursor:default}.sub{background:white;color:#253447;border:1px solid #cdd5df}.actions,.location{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.location{margin-top:16px}.location label{font-weight:600}.location input{flex:1;min-width:180px;border:1px solid #cdd5df;border-radius:7px;padding:10px;font:inherit;color:#18212d}.courses{margin:16px 0}.course{border-bottom:1px solid #eee;padding:12px 2px}.course label{display:flex;gap:10px;align-items:center}.course label span{flex:1;min-width:0;overflow-wrap:anywhere}.course small,.course .state{color:#697585}.course progress{display:block;width:100%;height:11px;margin:10px 0 2px}.course .state{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.course .state[data-state=error],.course .state[data-state=partial]{color:#9a4a00}#status{min-height:22px;white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:520px){.toolbar{padding:14px 0}h1{font-size:20px}.panel{padding:14px}.location input{flex-basis:100%}}
</style></head><body><main class="wrap"><header class="toolbar"><h1>Canvas 课程资料库</h1><button id="sync">同步所选课程</button></header><p class="hint">登录 Canvas → 选择同步位置和课程 → 点击同步。</p><div class="panel"><div class="actions"><button id="login" class="sub">登录 Canvas</button><button id="load" class="sub">刷新课程</button></div><div class="location"><label for="folder">同步位置</label><input id="folder" type="text" placeholder="选择或输入已有文件夹的完整路径"><button id="choose" class="sub">选择文件夹</button><button id="save-folder" class="sub">保存位置</button></div><div class="courses" id="courses">请先登录并刷新课程。</div><p id="status">等待操作</p></div></main>
<script>
const $=id=>document.getElementById(id);let busy=false,tracking=false,currentFolder='';
async function call(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'操作失败');return j}
function setFolder(folder){currentFolder=folder;$('folder').value=folder;}
function historyText(history){if(!history)return '尚未同步';const stamp=typeof history==='string'?history:history.at;const prefix=typeof history==='object'&&history.state==='partial'?'上次同步：部分完成 · ':'上次同步：';return prefix+new Date(stamp).toLocaleString();}
async function changeFolder(folder){setFolder(folder);const data=await call('/api/history');for(const row of document.querySelectorAll('.course')){row.querySelector('.last').textContent=historyText(data.history[row.dataset.id]);row.querySelector('progress').hidden=true;row.querySelector('.state').textContent='';}}
async function loadSettings(){try{setFolder((await call('/api/settings')).folder)}catch(e){$('status').textContent=e.message}}
$('login').onclick=async()=>{try{await call('/api/login',{});$('status').textContent='请在打开的浏览器中完成登录，然后刷新课程。'}catch(e){$('status').textContent=e.message}};
$('choose').onclick=async()=>{try{const data=await call('/api/choose-folder',{});if(!data.cancelled){await changeFolder(data.folder);$('status').textContent='同步位置已保存。'}}catch(e){$('status').textContent=e.message}};
$('save-folder').onclick=async()=>{try{const data=await call('/api/settings',{folder:$('folder').value});await changeFolder(data.folder);$('status').textContent='同步位置已保存。'}catch(e){$('status').textContent=e.message}};
function courseRow(c){const box=document.createElement('div');box.className='course';box.dataset.id=c.id;const label=document.createElement('label'),check=document.createElement('input'),name=document.createElement('span'),last=document.createElement('small'),bar=document.createElement('progress'),state=document.createElement('div');check.type='checkbox';check.value=c.id;name.textContent=c.name;last.className='last';last.textContent=historyText(c.history);bar.max=100;bar.value=0;bar.hidden=true;state.className='state';label.append(check,name,last);box.append(label,bar,state);return box;}
$('load').onclick=async()=>{try{$('status').textContent='正在读取课程…';const data=await call('/api/courses');if($('folder').value===currentFolder)setFolder(data.folder);$('courses').replaceChildren();for(const [title,isDashboard] of [['Dashboard 课程',true],['其他课程',false]]){const list=data.courses.filter(c=>Boolean(c.dashboard)===isDashboard);if(!list.length)continue;const h=document.createElement('h2');h.textContent=title;$('courses').append(h);for(const c of list)$('courses').append(courseRow(c));}$('status').textContent=data.warnings?.length?data.warnings.join('\n'):(data.courses.length?'请选择要同步的课程。':'没有找到可访问课程。')}catch(e){$('status').textContent=e.message}};
$('sync').onclick=async()=>{const ids=[...document.querySelectorAll('.course input:checked')].map(x=>Number(x.value));if(!ids.length){$('status').textContent='请至少选择一门课程。';return}if($('folder').value!==currentFolder){$('status').textContent='同步位置已更改，请先点击“保存位置”。';return}try{tracking=true;await call('/api/sync',{ids});$('status').textContent='开始同步…'}catch(e){tracking=false;$('status').textContent=e.message}};
async function refresh(){try{const s=await call('/api/status');if(s.busy||busy||tracking){$('status').textContent=s.message;for(const [id,data] of Object.entries(s.courses)){const row=document.querySelector(`.course[data-id="${id}"]`);if(!row)continue;const bar=row.querySelector('progress'),text=row.querySelector('.state'),last=row.querySelector('.last');bar.hidden=false;bar.value=data.percent;text.dataset.state=data.state;text.textContent=data.state==='running'?`同步中：${data.message}`:data.message;if(data.state==='partial'&&data.failures?.length)text.textContent+='\n'+data.failures.slice(0,5).map(x=>'• '+x).join('\n')+(data.failures.length>5?'\n更多详情见课程索引。':'');if(data.state==='running')last.textContent='同步中';else if(data.state==='pending')last.textContent='等待同步';else if(data.state==='error')last.textContent='同步失败';else if(data.last)last.textContent=historyText({at:data.last,state:data.state});}}for(const id of ['sync','load','login','choose','save-folder','folder'])$(id).disabled=s.busy;if(tracking&&!s.busy&&Object.keys(s.courses).length)tracking=false;busy=s.busy}catch{}setTimeout(refresh,1000)}
loadSettings();refresh();
</script></body></html>
